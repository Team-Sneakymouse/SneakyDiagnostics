name: SneakyDiagnostics
version: '${version}'
main: com.teamsneakymouse.sneakydiagnostics.SneakyDiagnosticsPlugin
api-version: '26.2'
description: On-demand diagnostics for investigating server performance and connections
author: Team Sneakymouse
website: https://github.com/Team-Sneakymouse/SneakyDiagnostics
softdepend: [spark]
commands:
  sneakydiagnostics:
    aliases: [diagnostics]
    description: Collect server diagnostics
    usage: /<command> <entities|timeline|scheduler|plugins|spark|connections|all> <start|status|stop>
  entitycensus:
    description: Collect a loaded-entity census (compatibility command)
    usage: /<command> <start [world] [seconds]|resume [seconds]|status|stop>
    permission: sneaky.entitycensus
permissions:
  sneakydiagnostics.all:
    description: Collect and control all diagnostics together
    default: op
    children:
      sneakydiagnostics.entities: true
      sneakydiagnostics.timeline: true
      sneakydiagnostics.scheduler: true
      sneakydiagnostics.plugins: true
      sneakydiagnostics.spark: true
      sneakydiagnostics.connections: true
  sneakydiagnostics.reports:
    description: List and prune saved capture folders (not implied by sneakydiagnostics.all)
    default: op
  sneakydiagnostics.connections:
    description: Collect and control connection latency reports
    default: op
  sneakydiagnostics.spark:
    description: Capture a local spark execution profile
    default: op
  sneakydiagnostics.plugins:
    description: Collect measurements from registered plugin probes
    default: op
  sneakydiagnostics.timeline:
    description: Collect and control tick timeline reports
    default: op
  sneakydiagnostics.scheduler:
    description: Collect and control scheduler snapshot reports
    default: op
  sneakydiagnostics.entities:
    description: Collect and control entity census reports
    default: op
  sneaky.entitycensus:
    description: Use the legacy entity census command
    default: op

